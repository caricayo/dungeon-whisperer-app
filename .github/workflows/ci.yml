name: Enterprise CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      - name: Security Audit
        run: npm audit --audit-level=moderate
      - name: Dependency Check
        run: npx better-npm-audit audit

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      - name: Type Check
        run: npm run type-check
      - name: Lint Check
        run: npm run lint:check
      - name: Format Check
        run: npm run format:check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      - name: Run Tests
        run: npm run test:coverage
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Build Application
        run: npm run build
      - name: Run E2E Tests
        run: npm run test:e2e
      - name: Upload E2E Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/

  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      - name: Build Application
        run: npm run build
      - name: Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [security-audit, code-quality, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      - name: Build
        run: npm run build
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, e2e-tests, lighthouse]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/
      - name: Deploy to Staging
        run: echo "Deploy to staging environment"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, e2e-tests, lighthouse]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/
      - name: Deploy to Production
        run: echo "Deploy to production environment"