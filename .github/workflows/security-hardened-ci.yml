name: Security Hardened CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      
      - name: Run security audit
        run: |
          npm audit --audit-level=high
          npm run audit
      
      - name: Check for vulnerable dependencies
        run: npm run depcheck
      
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  code-quality:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      
      - name: Run linter
        run: npm run lint
      
      - name: Check formatting
        run: npm run format:check
      
      - name: Type checking
        run: npm run typecheck
      
      - name: Dead code analysis
        run: npm run deadcode
      
      - name: Bundle analysis
        run: npm run analyze

  testing:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      
      - name: Run unit tests
        run: npm run test -- --coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: true

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      
      - name: Build application
        run: npm run build
      
      - name: Run Playwright tests
        run: npm run test:e2e
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      
      - name: Build application
        run: npm run build
      
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci autorun

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [security-audit, code-quality, testing, e2e-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      
      - name: Run pre-publish checks
        run: npm run pre-publish
      
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      
      - name: Build production bundle
        run: npm run build
      
      - name: Verify build security
        run: |
          # Check for exposed secrets in build
          find dist -name "*.js" -exec grep -l "sk-\|password\|secret" {} \; | wc -l | grep -q '^0$' || exit 1
          echo "✅ No exposed secrets in build"
      
      # Add deployment step here based on your hosting platform
      - name: Deploy to staging
        if: github.ref == 'refs/heads/develop'
        run: echo "Deploy to staging environment"
      
      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        run: echo "Deploy to production environment"

  performance-audit:
    name: Performance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      
      - name: Install dependencies (with rollup fix)
        run: |
          # Workaround for npm optional dependencies bug
          # https://github.com/npm/cli/issues/4828
          npm install --include=optional
          # Explicitly install rollup platform binary if missing
          if [ ! -d "node_modules/@rollup/rollup-linux-x64-gnu" ]; then
            npm install @rollup/rollup-linux-x64-gnu@4.21.3 --save-optional
          fi
      
      - name: Build application
        run: npm run build
      
      - name: Analyze bundle size
        run: |
          npm run analyze
          # Check if bundle sizes are within limits
          if [ -f "bundle-analysis.json" ]; then
            echo "Bundle analysis complete"
          fi